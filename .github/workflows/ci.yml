name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  # Target environment pins glibc 2.34 — binaries must not exceed this
  GLIBC_MAX: "2.34"

jobs:
  # Reused (via `container:`) by jobs below that don't produce the shipped
  # release binary: pre-installs Rust nightly + bpf-linker, and carries
  # OpenSSL 3.5+ so the smoke test's netns_pqc (X25519MLKEM768) scenario
  # actually runs instead of silently skipping (Ubuntu 22.04/24.04 both
  # stop at OpenSSL 3.0.x). Tag is a hash of the Containerfile, so this
  # only actually builds/pushes when that file changes — otherwise it's
  # just a manifest check and every other job reuses the existing image.
  # Deliberately NOT used by build-cli: that job produces the actual
  # shipped binary gated by GLIBC_MAX below, and stays on the bare,
  # single-purpose ubuntu-22.04 runner so this convenience image can
  # evolve for local dev without touching that gate.
  # See contrib/dev/Containerfile / docs/dev-container.md.
  dev-image:
    name: Build dev/test image
    runs-on: ubuntu-22.04
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        # Content-addressed: same Containerfile -> same tag, so unrelated
        # commits reuse the existing image instead of rebuilding/pushing
        # a new tag every run.
        id: resolve
        run: |
          echo "image=ghcr.io/smith-xyz/tls-probe-dev:${{ hashFiles('contrib/dev/Containerfile') }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing image
        id: check
        run: |
          if docker manifest inspect "${{ steps.resolve.outputs.image }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push dev/test image
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: contrib/dev/Containerfile
          push: true
          tags: ${{ steps.resolve.outputs.image }}

  # Gate: cheap checks first. Later jobs need this so a failure skips builds/push.
  test:
    name: Test
    needs: dev-image
    runs-on: ubuntu-22.04
    container:
      image: ${{ needs.dev-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Build eBPF (needed by workspace resolution)
        run: cargo xtask build-ebpf --profile release

      - name: Test
        run: cargo test -p tls-probe-common -p tls-probe-parser -p tls-probe

      - name: Clippy
        run: cargo clippy -p tls-probe-common -p tls-probe-parser -p tls-probe -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  build-ebpf:
    name: Build eBPF (${{ matrix.bpf-arch }})
    needs: [test, dev-image]
    runs-on: ubuntu-22.04
    container:
      image: ${{ needs.dev-image.outputs.image }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - bpf-arch: x86_64
            artifact-suffix: amd64
          - bpf-arch: aarch64
            artifact-suffix: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Build eBPF program
        run: cargo xtask build-ebpf --profile release --target-arch ${{ matrix.bpf-arch }}

      - name: Upload eBPF artifact
        uses: actions/upload-artifact@v4
        with:
          name: tls-probe-ebpf-${{ matrix.artifact-suffix }}
          path: target/bpfel-unknown-none/release/tls-probe-ebpf
          if-no-files-found: error

  build-cli:
    name: Build CLI (${{ matrix.arch }})
    needs: build-ebpf
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            cross-packages: ""
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            cross-packages: gcc-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation toolchain
        if: matrix.cross-packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross-packages }}

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Download eBPF artifact
        uses: actions/download-artifact@v4
        with:
          name: tls-probe-ebpf-${{ matrix.arch }}
          path: target/bpfel-unknown-none/release/

      - name: Configure linker for cross-compilation
        if: matrix.arch == 'arm64'
        run: |
          cat >> .cargo/config.toml <<'EOF'

          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build CLI
        run: cargo build --release -p tls-probe --target ${{ matrix.target }}

      - name: Verify glibc compatibility
        run: |
          MAX="${GLIBC_MAX}"
          REQUIRED=$(readelf -V target/${{ matrix.target }}/release/tls-probe 2>/dev/null \
            | grep -oP 'GLIBC_\K[0-9]+\.[0-9]+' | sort -Vu | tail -1)
          echo "Required: GLIBC_${REQUIRED}  Max allowed: GLIBC_${MAX}"
          if [ "$(printf '%s\n' "$MAX" "$REQUIRED" | sort -V | tail -1)" != "$MAX" ]; then
            echo "::error::Binary requires GLIBC_${REQUIRED} but target hosts only have GLIBC_${MAX}"
            exit 1
          fi

      - name: Rename binary
        run: |
          cp target/${{ matrix.target }}/release/tls-probe \
            tls-probe-linux-${{ matrix.arch }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: tls-probe-linux-${{ matrix.arch }}
          path: tls-probe-linux-${{ matrix.arch }}
          if-no-files-found: error

  # Runtime coverage is the runner kernel (6.x) only. The 5.8 kernel floor is
  # deliberately NOT exercised here: 5.8 is EOL/non-LTS with no maintained
  # prebuilt BPF test images, so a vmtest job would mean building a patched
  # kernel per run or hosting a binary blob. Waiver + rationale + revisit
  # triggers: docs/kernel-support.md.
  smoke-test:
    name: Smoke Test (eBPF runtime)
    needs: [build-cli, dev-image]
    runs-on: ubuntu-22.04
    container:
      image: ${{ needs.dev-image.outputs.image }}
      # eBPF attach needs real root/capabilities; the container job runs as
      # root already (no `sudo` in this image), --privileged grants the rest.
      options: --privileged
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve runner architecture
        id: arch
        run: |
          case "$(uname -m)" in
            x86_64)  echo "arch=amd64" >> "$GITHUB_OUTPUT" ;;
            aarch64) echo "arch=arm64" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::No tls-probe artifact for runner arch $(uname -m)"; exit 1 ;;
          esac

      - name: Download CLI binary
        uses: actions/download-artifact@v4
        with:
          name: tls-probe-linux-${{ steps.arch.outputs.arch }}
          path: smoke/

      - name: Download eBPF object
        uses: actions/download-artifact@v4
        with:
          name: tls-probe-ebpf-${{ steps.arch.outputs.arch }}
          path: smoke/

      - name: Run smoke test
        run: |
          chmod +x smoke/tls-probe-linux-${{ steps.arch.outputs.arch }}
          python3 scripts/smoke_test.py \
            --probe smoke/tls-probe-linux-${{ steps.arch.outputs.arch }} \
            --ebpf smoke/tls-probe-ebpf \
            --schema specs/capture-event.schema.json \
            --workdir smoke/run

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-${{ steps.arch.outputs.arch }}
          # The test cert/key are minted by root with 0600 perms (EACCES for
          # the runner user) and a private key has no business in an artifact.
          path: |
            smoke/run/
            !smoke/run/*.pem
          if-no-files-found: warn

  # New assertion (roadmap 3.3): does not gate the container image publish
  # until it has proven itself stable on real runners.
  container-attribution:
    name: Container Attribution (cgroup runtime)
    needs: build-cli
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Resolve runner architecture
        id: arch
        run: |
          case "$(uname -m)" in
            x86_64)  echo "arch=amd64" >> "$GITHUB_OUTPUT" ;;
            aarch64) echo "arch=arm64" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::No tls-probe artifact for runner arch $(uname -m)"; exit 1 ;;
          esac

      - name: Download CLI binary
        uses: actions/download-artifact@v4
        with:
          name: tls-probe-linux-${{ steps.arch.outputs.arch }}
          path: attribution/

      - name: Download eBPF object
        uses: actions/download-artifact@v4
        with:
          name: tls-probe-ebpf-${{ steps.arch.outputs.arch }}
          path: attribution/

      - name: Start containerized workload
        # --network host: shares the host's network namespace so the kprobe
        # and TC classifier both see the same IP addresses. Without this,
        # Docker bridge NAT rewrites the source IP between the kprobe
        # (which sees the container's veth addr) and TC (which sees the
        # SNAT'd host addr), breaking the CONN_MAP 4-tuple match.
        # The container still gets its own cgroup, so container_id
        # resolution via /sys/fs/cgroup still works.
        run: |
          docker run -d --name tls-workload --network host --entrypoint sleep \
            curlimages/curl:latest 300

      - name: Capture workload TLS traffic from the host
        run: |
          chmod +x attribution/tls-probe-linux-${{ steps.arch.outputs.arch }}
          sudo attribution/tls-probe-linux-${{ steps.arch.outputs.arch }} \
            --log-level info capture \
            --interface all \
            --ebpf attribution/tls-probe-ebpf \
            --output attribution/events.jsonl \
            --duration 20 \
            > attribution/probe.log 2>&1 &
          PROBE_PID=$!
          # Same readiness marker the smoke test polls for.
          for _ in $(seq 45); do
            grep -q "Probes attached:" attribution/probe.log && break
            if ! ps -p "$PROBE_PID" > /dev/null; then
              echo "::error::probe exited before attaching"
              cat attribution/probe.log
              exit 1
            fi
            sleep 1
          done
          if ! grep -q "Probes attached:" attribution/probe.log; then
            echo "::error::probe did not attach in time"
            cat attribution/probe.log
            exit 1
          fi
          docker exec tls-workload curl -so /dev/null https://example.com
          docker exec tls-workload curl -so /dev/null https://example.com
          wait "$PROBE_PID"

      - name: Assert container attribution
        run: |
          WORKLOAD_ID=$(docker inspect --format '{{.Id}}' tls-workload)
          python3 - "$WORKLOAD_ID" <<'EOF'
          import json
          import sys

          workload_id = sys.argv[1]
          with open("attribution/events.jsonl") as fh:
              lines = [line for line in fh.read().splitlines() if line.strip()]

          attributed = [
              event
              for event in map(json.loads, lines)
              if event.get("handshake_type") == "ClientHello"
              and event.get("container_id")
              and event.get("cgroup_id") is not None
          ]
          if not attributed:
              print("::error::no ClientHello event carried container attribution")
              print("--- first 20 captured events ---")
              print("\n".join(lines[:20]))
              sys.exit(1)

          for event in attributed:
              marker = (
                  "workload match"
                  if workload_id.startswith(event["container_id"])
                  else "other container"
              )
              print(f"[{marker}] {json.dumps(event)}")
          EOF

      - name: Upload attribution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-attribution-${{ steps.arch.outputs.arch }}
          path: |
            attribution/events.jsonl
            attribution/probe.log
          if-no-files-found: warn

  container:
    name: Container Image (dev)
    # Gate the :dev tag on the runtime smoke test, not just on it compiling.
    needs: [build-cli, smoke-test]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare build context
        run: |
          mkdir -p dist/linux/amd64 dist/linux/arm64
          cp artifacts/tls-probe-linux-amd64/tls-probe-linux-amd64 dist/linux/amd64/tls-probe
          cp artifacts/tls-probe-linux-arm64/tls-probe-linux-arm64 dist/linux/arm64/tls-probe
          cp artifacts/tls-probe-ebpf-amd64/tls-probe-ebpf dist/linux/amd64/tls-probe-ebpf
          cp artifacts/tls-probe-ebpf-arm64/tls-probe-ebpf dist/linux/arm64/tls-probe-ebpf
          chmod +x dist/linux/*/tls-probe

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/smith-xyz/tls-probe:dev
            ghcr.io/smith-xyz/tls-probe:sha-${{ github.sha }}
