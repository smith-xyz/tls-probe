name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  # RHCOS 4.x ships glibc 2.34 — binaries must not exceed this
  GLIBC_MAX: "2.34"

jobs:
  # Gate: cheap checks first. Later jobs need this so a failure skips builds/push.
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev

      - name: Install Rust nightly + bpf-linker
        run: |
          rustup install nightly
          rustup component add rust-src --toolchain nightly
          cargo +nightly install bpf-linker

      - name: Build eBPF (needed by workspace resolution)
        run: cargo xtask build-ebpf --profile release

      - name: Test
        run: cargo test -p tls-probe-common -p tls-probe-parser -p tls-probe

      - name: Clippy
        run: cargo clippy -p tls-probe-common -p tls-probe-parser -p tls-probe -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  build-ebpf:
    name: Build eBPF (${{ matrix.bpf-arch }})
    needs: test
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - bpf-arch: x86_64
            artifact-suffix: amd64
          - bpf-arch: aarch64
            artifact-suffix: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev

      - name: Install Rust nightly + bpf-linker
        run: |
          rustup install nightly
          rustup component add rust-src --toolchain nightly
          cargo +nightly install bpf-linker

      - name: Build eBPF program
        run: cargo xtask build-ebpf --profile release --target-arch ${{ matrix.bpf-arch }}

      - name: Upload eBPF artifact
        uses: actions/upload-artifact@v4
        with:
          name: tls-probe-ebpf-${{ matrix.artifact-suffix }}
          path: target/bpfel-unknown-none/release/tls-probe-ebpf
          if-no-files-found: error

  build-cli:
    name: Build CLI (${{ matrix.arch }})
    needs: build-ebpf
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            cross-packages: ""
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            cross-packages: gcc-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation toolchain
        if: matrix.cross-packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross-packages }}

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Download eBPF artifact
        uses: actions/download-artifact@v4
        with:
          name: tls-probe-ebpf-${{ matrix.arch }}
          path: target/bpfel-unknown-none/release/

      - name: Configure linker for cross-compilation
        if: matrix.arch == 'arm64'
        run: |
          cat >> .cargo/config.toml <<'EOF'

          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build CLI
        run: cargo build --release -p tls-probe --target ${{ matrix.target }}

      - name: Verify glibc compatibility
        run: |
          MAX="${GLIBC_MAX}"
          REQUIRED=$(readelf -V target/${{ matrix.target }}/release/tls-probe 2>/dev/null \
            | grep -oP 'GLIBC_\K[0-9]+\.[0-9]+' | sort -Vu | tail -1)
          echo "Required: GLIBC_${REQUIRED}  Max allowed: GLIBC_${MAX}"
          if [ "$(printf '%s\n' "$MAX" "$REQUIRED" | sort -V | tail -1)" != "$MAX" ]; then
            echo "::error::Binary requires GLIBC_${REQUIRED} but RHCOS only has GLIBC_${MAX}"
            exit 1
          fi

      - name: Rename binary
        run: |
          cp target/${{ matrix.target }}/release/tls-probe \
            tls-probe-linux-${{ matrix.arch }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: tls-probe-linux-${{ matrix.arch }}
          path: tls-probe-linux-${{ matrix.arch }}
          if-no-files-found: error

  smoke-test:
    name: Smoke Test (eBPF runtime)
    needs: build-cli
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve runner architecture
        id: arch
        run: |
          case "$(uname -m)" in
            x86_64)  echo "arch=amd64" >> "$GITHUB_OUTPUT" ;;
            aarch64) echo "arch=arm64" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::No tls-probe artifact for runner arch $(uname -m)"; exit 1 ;;
          esac

      - name: Download CLI binary
        uses: actions/download-artifact@v4
        with:
          name: tls-probe-linux-${{ steps.arch.outputs.arch }}
          path: smoke/

      - name: Download eBPF object
        uses: actions/download-artifact@v4
        with:
          name: tls-probe-ebpf-${{ steps.arch.outputs.arch }}
          path: smoke/

      # Installed as root because the smoke test runs under sudo. The script
      # falls back to a builtin validator if this is unavailable.
      - name: Install schema validator
        run: sudo python3 -m pip install --quiet jsonschema

      - name: Run smoke test
        run: |
          chmod +x smoke/tls-probe-linux-${{ steps.arch.outputs.arch }}
          sudo python3 scripts/smoke_test.py \
            --probe smoke/tls-probe-linux-${{ steps.arch.outputs.arch }} \
            --ebpf smoke/tls-probe-ebpf \
            --schema specs/capture-event.schema.json \
            --workdir smoke/run

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-${{ steps.arch.outputs.arch }}
          # The test cert/key are minted by root with 0600 perms (EACCES for
          # the runner user) and a private key has no business in an artifact.
          path: |
            smoke/run/
            !smoke/run/*.pem
          if-no-files-found: warn

  container:
    name: Container Image (dev)
    # Gate the :dev tag on the runtime smoke test, not just on it compiling.
    needs: [build-cli, smoke-test]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare build context
        run: |
          mkdir -p dist/linux/amd64 dist/linux/arm64
          cp artifacts/tls-probe-linux-amd64/tls-probe-linux-amd64 dist/linux/amd64/tls-probe
          cp artifacts/tls-probe-linux-arm64/tls-probe-linux-arm64 dist/linux/arm64/tls-probe
          cp artifacts/tls-probe-ebpf-amd64/tls-probe-ebpf dist/linux/amd64/tls-probe-ebpf
          cp artifacts/tls-probe-ebpf-arm64/tls-probe-ebpf dist/linux/arm64/tls-probe-ebpf
          chmod +x dist/linux/*/tls-probe

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/smith-xyz/tls-probe:dev
            ghcr.io/smith-xyz/tls-probe:sha-${{ github.sha }}
