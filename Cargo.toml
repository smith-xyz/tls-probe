[workspace]
resolver = "2"
members = [
    "crates/tls-probe-common",
    "crates/tls-probe-ebpf",
    "crates/tls-probe-parser",
    "crates/tls-probe-cli",
    "xtask",
]
# eBPF is no_std/bpfel — exclude from default cargo check/test/clippy.
# Build it via: cargo xtask build-ebpf
default-members = [
    "crates/tls-probe-common",
    "crates/tls-probe-parser",
    "crates/tls-probe-cli",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/smith-xyz/tls-probe"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1.49", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
chrono = "0.4"

aya = "0.14"

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
